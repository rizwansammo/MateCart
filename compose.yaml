# MateCart local development stack.
#
# Isolation rules (other projects share this Docker Desktop):
#   - Compose project "matecart-dev": every container is prefixed matecart-dev-*.
#   - Dedicated, explicitly named volumes and networks; nothing external is reused.
#   - All ports are published on 127.0.0.1 only and configurable through .env.
#   - Commerce and control services sit on separate networks: control-api cannot reach the
#     commerce database, mirroring the production boundary between client stores and the console.
#
# Usage: pnpm stack:up | stack:down | stack:logs | stack:ps (see docs/DEVELOPMENT_SETUP.md).
# The Next.js apps run on the host (pnpm dev) for fast reloads on Windows.

name: matecart-dev

x-commerce-api-environment: &commerce-api-environment
  DJANGO_SETTINGS_MODULE: config.settings.development
  DJANGO_SECRET_KEY: ${MATECART_COMMERCE_SECRET_KEY:?run `pnpm setup:env` to create .env}
  DJANGO_LOG_FORMAT: console
  DATABASE_URL: postgres://matecart_commerce:${MATECART_COMMERCE_DB_PASSWORD:?run `pnpm setup:env`}@commerce-db:5432/matecart_commerce
  REDIS_URL: redis://:${MATECART_COMMERCE_REDIS_PASSWORD:?run `pnpm setup:env`}@commerce-redis:6379/0
  CELERY_BROKER_URL: redis://:${MATECART_COMMERCE_REDIS_PASSWORD}@commerce-redis:6379/1
  CELERY_RESULT_BACKEND: redis://:${MATECART_COMMERCE_REDIS_PASSWORD}@commerce-redis:6379/2
  # The one store this deployment serves; never taken from requests (docs/ARCHITECTURE.md §3).
  MATECART_TENANCY_MODE: single
  MATECART_TENANT_ID: ${MATECART_TENANT_ID:?run `pnpm setup:env` to add MATECART_TENANT_ID to .env}
  # Authentication (docs/SECURITY.md). Local HTTP only: cookies drop the Secure flag here, never
  # in production. The storefront at :3400 proxies /api/* to this service (one trusted hop).
  MATECART_ENCRYPTION_KEY: ${MATECART_COMMERCE_ENCRYPTION_KEY:?run `pnpm setup:env`}
  MATECART_SECURE_COOKIES: 'false'
  MATECART_PUBLIC_BASE_URL: http://127.0.0.1:3400
  DJANGO_CSRF_TRUSTED_ORIGINS: http://127.0.0.1:3400,http://localhost:3400
  MATECART_TRUSTED_PROXY_COUNT: '1'
  # Every email goes to the local Mailpit inbox (http://127.0.0.1:18025); nothing leaves the machine.
  EMAIL_URL: smtp://mailpit:1025
  DEFAULT_FROM_EMAIL: MateCart Dev Store <no-reply@matecart.test>
  # No SMS provider locally: phone sign-in stays disabled until a real gateway is configured.
  MATECART_SMS_PROVIDER: ''
  # Optional: Google OAuth client for local testing (docs/AUTHENTICATION.md). Empty hides the button.
  GOOGLE_OIDC_CLIENT_ID: ${MATECART_GOOGLE_OIDC_CLIENT_ID:-}
  GOOGLE_OIDC_CLIENT_SECRET: ${MATECART_GOOGLE_OIDC_CLIENT_SECRET:-}

x-commerce-api-build: &commerce-api-build
  context: ./services/commerce-api
  target: dev

services:
  # ---------------------------------------------------------------- commerce (client store)
  commerce-db:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: matecart_commerce
      POSTGRES_USER: matecart_commerce
      POSTGRES_PASSWORD: ${MATECART_COMMERCE_DB_PASSWORD:?run `pnpm setup:env`}
    ports:
      - '127.0.0.1:${MATECART_COMMERCE_DB_PORT:-15440}:5432'
    volumes:
      # PostgreSQL 18+ images keep data under /var/lib/postgresql/<major>/docker.
      - commerce-db-data:/var/lib/postgresql
    networks: [commerce]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U matecart_commerce -d matecart_commerce']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  commerce-redis:
    image: redis:8.10.2-alpine
    environment:
      REDIS_PASSWORD: ${MATECART_COMMERCE_REDIS_PASSWORD:?run `pnpm setup:env`}
    command: ['sh', '-c', 'exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes']
    ports:
      - '127.0.0.1:${MATECART_COMMERCE_REDIS_PORT:-16380}:6379'
    volumes:
      - commerce-redis-data:/data
    networks: [commerce]
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  commerce-api:
    build: *commerce-api-build
    image: matecart-dev/commerce-api:dev
    command:
      [
        'sh',
        '-c',
        'python manage.py migrate --noinput && exec python manage.py runserver 0.0.0.0:8000',
      ]
    environment: *commerce-api-environment
    ports:
      - '127.0.0.1:${MATECART_COMMERCE_API_PORT:-8400}:8000'
    volumes:
      - ./services/commerce-api:/app
    networks: [commerce]
    depends_on:
      commerce-db: { condition: service_healthy }
      commerce-redis: { condition: service_healthy }
      mailpit: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/live/', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  commerce-worker:
    build: *commerce-api-build
    image: matecart-dev/commerce-api:dev
    command:
      [
        'celery',
        '-A',
        'config',
        'worker',
        '--loglevel=INFO',
        '--concurrency=2',
        '--hostname=commerce-worker@%h',
      ]
    environment: *commerce-api-environment
    volumes:
      - ./services/commerce-api:/app
    networks: [commerce]
    depends_on:
      commerce-db: { condition: service_healthy }
      commerce-redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'celery -A config inspect ping --destination commerce-worker@$$HOSTNAME --timeout 5',
        ]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ---------------------------------------------------------------- local mail catcher
  # Receives every email both APIs send in development (verification codes, invitations, resets)
  # and shows them at http://127.0.0.1:18025. Nothing is relayed to real mailboxes.
  mailpit:
    image: axllent/mailpit:v1.31.4
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - '127.0.0.1:${MATECART_MAILPIT_PORT:-18025}:8025'
    networks: [commerce, control]
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ---------------------------------------------------------------- control (NetaMate console)
  control-db:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: matecart_control
      POSTGRES_USER: matecart_control
      POSTGRES_PASSWORD: ${MATECART_CONTROL_DB_PASSWORD:?run `pnpm setup:env`}
    ports:
      - '127.0.0.1:${MATECART_CONTROL_DB_PORT:-15441}:5432'
    volumes:
      - control-db-data:/var/lib/postgresql
    networks: [control]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U matecart_control -d matecart_control']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  control-redis:
    image: redis:8.10.2-alpine
    environment:
      REDIS_PASSWORD: ${MATECART_CONTROL_REDIS_PASSWORD:?run `pnpm setup:env`}
    command: ['sh', '-c', 'exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes']
    volumes:
      - control-redis-data:/data
    networks: [control]
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  control-api:
    build:
      context: ./services/control-api
      target: dev
    image: matecart-dev/control-api:dev
    command:
      [
        'sh',
        '-c',
        'python manage.py migrate --noinput && exec python manage.py runserver 0.0.0.0:8000',
      ]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_SECRET_KEY: ${MATECART_CONTROL_SECRET_KEY:?run `pnpm setup:env`}
      DJANGO_LOG_FORMAT: console
      DATABASE_URL: postgres://matecart_control:${MATECART_CONTROL_DB_PASSWORD}@control-db:5432/matecart_control
      REDIS_URL: redis://:${MATECART_CONTROL_REDIS_PASSWORD}@control-redis:6379/0
      MATECART_ENCRYPTION_KEY: ${MATECART_CONTROL_ENCRYPTION_KEY:?run `pnpm setup:env`}
      MATECART_SECURE_COOKIES: 'false'
      MATECART_CONSOLE_PUBLIC_BASE_URL: http://127.0.0.1:3410
      DJANGO_CSRF_TRUSTED_ORIGINS: http://127.0.0.1:3410,http://localhost:3410
      MATECART_TRUSTED_PROXY_COUNT: '1'
      EMAIL_URL: smtp://mailpit:1025
      DEFAULT_FROM_EMAIL: NetaMate Console <no-reply@console.matecart.test>
    ports:
      - '127.0.0.1:${MATECART_CONTROL_API_PORT:-8410}:8000'
    volumes:
      - ./services/control-api:/app
    networks: [control]
    depends_on:
      control-db: { condition: service_healthy }
      control-redis: { condition: service_healthy }
      mailpit: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/live/', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

volumes:
  commerce-db-data:
    name: matecart-dev-commerce-db-data
  commerce-redis-data:
    name: matecart-dev-commerce-redis-data
  control-db-data:
    name: matecart-dev-control-db-data
  control-redis-data:
    name: matecart-dev-control-redis-data

networks:
  commerce:
    name: matecart-dev-commerce
  control:
    name: matecart-dev-control
