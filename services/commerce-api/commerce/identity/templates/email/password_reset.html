{% extends "email/_layout.html" %}
{% block content %}
<h1 style="margin:0 0 12px;font-size:22px;line-height:28px">Reset your password</h1>
<p style="margin:0 0 20px;font-size:15px;line-height:22px">Use the button below to choose a new password. The link works once and expires in 1 hour.</p>
<p style="margin:0 0 20px"><a href="{{ link }}" style="display:inline-block;padding:12px 20px;background:#00843c;color:#ffffff;text-decoration:none;font-weight:700;border-radius:4px">Choose a new password</a></p>
<p style="margin:0;font-size:13px;line-height:20px;color:#5d6762">If you didn't ask for this, your password stays the same.</p>
{% endblock %}
