<!doctype html>
<html lang="en">
  <body style="margin:0;padding:24px;background:#f4f5f3;font-family:Arial,Helvetica,sans-serif;color:#1b1f1d">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;margin:0 auto;background:#ffffff;border:1px solid #e3e7e4;border-radius:4px">
      <tr>
        <td style="padding:28px 32px">
          <p style="margin:0 0 20px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#00843c">{{ store_name }}</p>
          {% block content %}{% endblock %}
          <p style="margin:28px 0 0;font-size:12px;line-height:18px;color:#5d6762">You received this email because of activity on your {{ store_name }} account. If it wasn't you, you can ignore it.</p>
        </td>
      </tr>
    </table>
  </body>
</html>
