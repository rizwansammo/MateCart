            $ref: '#/components/schemas/Warranty'
      required:
      - count
      - page
      - page_size
      - results
    WarrantyProviderEnum:
      enum:
      - manufacturer
      - seller
      type: string
      description: |-
        * `manufacturer` - Manufacturer
        * `seller` - Seller
    WarrantyWriteRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        duration_months:
          type: integer
          maximum: 120
          minimum: 1
        provider:
          $ref: '#/components/schemas/WarrantyProviderEnum'
        terms:
          type: string
          maxLength: 4000
        is_active:
          type: boolean
      required:
      - duration_months
      - name
      - provider
  securitySchemes:
    customerSession:
      type: apiKey
      in: cookie
      name: mc_customer
      description: Customer session (HttpOnly). Unsafe methods need X-CSRFToken.
    staffPendingMfa:
      type: apiKey
      in: cookie
      name: mc_staff
      description: A password-verified staff session waiting for the second step.
    staffSession:
      type: apiKey
      in: cookie
      name: mc_staff
      description: Merchant staff session (HttpOnly, path /api/manage).
