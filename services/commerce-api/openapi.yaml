openapi: 3.0.3
info:
  title: MateCart Commerce API
  version: 0.1.0
  description: Storefront, checkout and merchant API for a single MateCart store deployment.
paths:
  /api/account/addresses/:
    get:
      operationId: address_list
      description: Base for every cookie-authenticated or sign-in endpoint.
      tags:
      - checkout
      security:
      - customerSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Address'
          description: ''
    post:
      operationId: address_create
      description: Base for every cookie-authenticated or sign-in endpoint.
      tags:
      - checkout
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressInputRequest'
      security:
      - customerSession: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
          description: ''
  /api/account/addresses/{address_id}/:
    patch:
      operationId: address_update
      description: Base for every cookie-authenticated or sign-in endpoint.
      parameters:
      - in: path
        name: address_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - checkout
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAddressInputRequest'
      security:
      - customerSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
          description: ''
    delete:
      operationId: address_delete
      description: Base for every cookie-authenticated or sign-in endpoint.
      parameters:
      - in: path
        name: address_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - checkout
      security:
      - customerSession: []
      responses:
        '204':
          description: No response body
  /api/account/code/resend/:
    post:
      operationId: account_code_resend
      description: Resend a code for a registration, phone sign-in, or (signed in)
        a linking or step-up code.
      tags:
      - account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeRefRequest'
        required: true
      security:
      - customerSession: []
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challenge'
          description: ''
  /api/account/google/callback/:
    get:
      operationId: account_google_callback
      description: Google redirects the browser here. Always answers with a redirect
        to a storefront page.
      parameters:
      - in: query
        name: code
        schema:
          type: string
      - in: query
        name: error
        schema:
          type: string
      - in: query
        name: state
        schema:
          type: string
      tags:
      - account
      security:
      - {}
      responses:
        '302':
          description: Redirect to the storefront
  /api/account/google/start/:
    get:
      operationId: account_google_start
      description: 'Browser navigation (not XHR): redirects to Google''s consent screen.'
      parameters:
      - in: query
        name: next
        schema:
          type: string
      tags:
      - account
      security:
      - {}
      responses:
        '302':
          description: Redirect to Google
  /api/account/library/:
    get:
      operationId: buyer_digital_library
      description: Base for every cookie-authenticated or sign-in endpoint.
      tags:
      - digital-library
      security:
      - customerSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LibraryItem'
          description: ''
  /api/account/library/{entitlement_id}/download/:
    get:
      operationId: buyer_digital_download
      description: Base for every cookie-authenticated or sign-in endpoint.
      parameters:
      - in: path
        name: entitlement_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - digital-library
      security:
      - customerSession: []
      responses:
        '200':
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          description: ''
  /api/account/link/email/start/:
    post:
      operationId: account_link_email_start
      description: Base for every cookie-authenticated or sign-in endpoint.
      tags:
      - account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
        required: true
      security:
      - customerSession: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challenge'
          description: ''
  /api/account/link/email/verify/:
    post:
      operationId: account_link_email_verify
      description: Base for every cookie-authenticated or sign-in endpoint.
      tags:
      - account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeCodeRequest'
        required: true
      security:
      - customerSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerAccount'
          description: ''
  /api/account/link/google/remove/:
    post:
      operationId: account_unlink_google
      description: Base for every cookie-authenticated or sign-in endpoint.
      tags:
      - account
      security:
      - customerSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerAccount'
          description: ''
  /api/account/link/google/start/:
    post:
      operationId: account_link_google_start
      description: Base for every cookie-authenticated or sign-in endpoint.
      tags:
      - account
      security:
      - customerSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleStart'
          description: ''
  /api/account/link/phone/start/:
    post:
      operationId: account_link_phone_start
      description: Base for every cookie-authenticated or sign-in endpoint.
      tags:
      - account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneRequest'
        required: true
      security:
      - customerSession: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challenge'
          description: ''
  /api/account/link/phone/verify/:
    post:
      operationId: account_link_phone_verify
      description: Base for every cookie-authenticated or sign-in endpoint.
      tags:
      - account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeCodeRequest'
        required: true
      security:
      - customerSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerAccount'
          description: ''
  /api/account/login/:
    post:
      operationId: account_login
      description: Sign-in and registration steps. The customer cookie is read only
        to sign out or link.
      tags:
      - account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerAccount'
          description: ''
  /api/account/logout/:
    post:
      operationId: account_logout
      description: Sign-in and registration steps. The customer cookie is read only
        to sign out or link.
      tags:
      - account
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/account/me/:
    get:
      operationId: account_me
      description: Base for every cookie-authenticated or sign-in endpoint.
      tags:
      - account
      security:
      - customerSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerAccount'
          description: ''
    patch:
      operationId: account_me_update
      description: Base for every cookie-authenticated or sign-in endpoint.
      tags:
      - account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
      security:
      - customerSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerAccount'
          description: ''
  /api/account/methods/:
    get:
      operationId: account_methods
      description: Sign-in and registration steps. The customer cookie is read only
        to sign out or link.
      tags:
      - account
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInMethods'
          description: ''
  /api/account/password/change/:
    post:
      operationId: account_password_change
      description: Change the password, or set one for accounts created by phone or
        Google.
      tags:
      - account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      security:
      - customerSession: []
      responses:
        '204':
          description: No response body
  /api/account/password/forgot/:
    post:
      operationId: account_password_forgot
      description: 'Always 202: the response never reveals whether the email has an
        account.'
      tags:
      - account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
        required: true
      security:
      - {}
      responses:
        '202':
          description: No response body
  /api/account/password/reset/:
    post:
      operationId: account_password_reset
      description: Sign-in and registration steps. The customer cookie is read only
        to sign out or link.
      tags:
      - account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/account/phone/complete/:
    post:
      operationId: account_phone_complete
      description: Sign-in and registration steps. The customer cookie is read only
        to sign out or link.
      tags:
      - account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneCompleteRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerAccount'
          description: ''
  /api/account/phone/start/:
    post:
      operationId: account_phone_start
      description: Sign-in and registration steps. The customer cookie is read only
        to sign out or link.
      tags:
      - account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneRequest'
        required: true
      security:
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challenge'
          description: ''
  /api/account/phone/verify/:
    post:
      operationId: account_phone_verify
      description: Sign-in and registration steps. The customer cookie is read only
        to sign out or link.
      tags:
      - account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeCodeRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneVerifyResult'
          description: ''
  /api/account/reauthenticate/:
    post:
      operationId: account_reauthenticate
      description: Base for every cookie-authenticated or sign-in endpoint.
      tags:
      - account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthenticateRequest'
      security:
      - customerSession: []
      responses:
        '204':
          description: No response body
  /api/account/reauthenticate/code/:
    post:
      operationId: account_reauthenticate_code
      description: Base for every cookie-authenticated or sign-in endpoint.
      tags:
      - account
      security:
      - customerSession: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challenge'
          description: ''
  /api/account/register/:
    post:
      operationId: account_register
      description: Sends a 6-digit code to the email; the account is created once
        confirmed.
      tags:
      - account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challenge'
          description: ''
  /api/account/register/verify/:
    post:
      operationId: account_register_verify
      description: Sign-in and registration steps. The customer cookie is read only
        to sign out or link.
      tags:
      - account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeCodeRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerAccount'
          description: ''
  /api/cart/:
    get:
      operationId: cart_get
      description: Base for every cookie-authenticated or sign-in endpoint.
      tags:
      - cart
      security:
      - customerSession: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
  /api/cart/items/:
    post:
      operationId: cart_item_add
      description: Base for every cookie-authenticated or sign-in endpoint.
      tags:
      - cart
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCartItemRequest'
        required: true
      security:
      - customerSession: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
  /api/cart/items/{item_id}/:
    patch:
      operationId: cart_item_update
      description: Base for every cookie-authenticated or sign-in endpoint.
      parameters:
      - in: path
        name: item_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - cart
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUpdateCartItemRequest'
      security:
      - customerSession: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
    delete:
      operationId: cart_item_remove
      description: Base for every cookie-authenticated or sign-in endpoint.
      parameters:
      - in: path
        name: item_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - cart
      security:
      - customerSession: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
  /api/cases/:
    get:
      operationId: customer_cases
      description: Base for every cookie-authenticated or sign-in endpoint.
      tags:
      - aftersales
      security:
      - customerSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AfterSalesCasePage'
          description: ''
    post:
      operationId: customer_case_submit
      description: Base for every cookie-authenticated or sign-in endpoint.
      tags:
      - aftersales
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseInputRequest'
        required: true
      security:
      - customerSession: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AfterSalesCase'
          description: ''
  /api/cases/{case_id}/:
    get:
      operationId: customer_case_detail
      description: Base for every cookie-authenticated or sign-in endpoint.
      parameters:
      - in: path
        name: case_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - aftersales
      security:
      - customerSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AfterSalesCase'
          description: ''
    post:
      operationId: customer_case_reply
      description: Base for every cookie-authenticated or sign-in endpoint.
      parameters:
      - in: path
        name: case_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - aftersales
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseMessageInputRequest'
        required: true
      security:
      - customerSession: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseMessage'
          description: ''
  /api/catalog/categories/:
    get:
      operationId: catalog_categories
      description: Base for every cookie-authenticated or sign-in endpoint.
      tags:
      - catalog
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicCategoryNode'
          description: ''
  /api/catalog/collections/:
    get:
      operationId: catalog_collections
      description: Base for every cookie-authenticated or sign-in endpoint.
      parameters:
      - in: query
        name: page
        schema:
          type: integer
          maximum: 100000
          minimum: 1
          default: 1
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 25
      tags:
      - catalog
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicCollectionPage'
          description: ''
  /api/catalog/collections/{slug}/:
    get:
      operationId: catalog_collection
      description: Base for every cookie-authenticated or sign-in endpoint.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - catalog
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicCollection'
          description: ''
  /api/catalog/media/{asset_id}/:
    get:
      operationId: catalog_media
      description: An image (or PDF size guide) used by an active product, category
        or collection.
      parameters:
      - in: path
        name: asset_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - catalog
      security:
      - {}
      responses:
        '200':
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          description: ''
  /api/catalog/products/:
    get:
      operationId: catalog_products
      description: Base for every cookie-authenticated or sign-in endpoint.
      parameters:
      - in: query
        name: brand
        schema:
          type: string
          minLength: 1
          maxLength: 140
          pattern: ^[-a-zA-Z0-9_]+$
      - in: query
        name: category
        schema:
          type: string
          minLength: 1
          maxLength: 140
          pattern: ^[-a-zA-Z0-9_]+$
      - in: query
        name: collection
        schema:
          type: string
          minLength: 1
          maxLength: 140
          pattern: ^[-a-zA-Z0-9_]+$
      - in: query
        name: max_price
        schema:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,4})?$
      - in: query
        name: min_price
        schema:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,4})?$
      - in: query
        name: ordering
        schema:
          enum:
          - newest
          - name
          - price_low
          - price_high
          - featured
          type: string
          minLength: 1
        description: |-
          * `newest` - newest
          * `name` - name
          * `price_low` - price_low
          * `price_high` - price_high
          * `featured` - featured
      - in: query
        name: page
        schema:
          type: integer
          maximum: 100000
          minimum: 1
          default: 1
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 25
      - in: query
        name: product_type
        schema:
          enum:
          - standard
          - apparel
          - grocery
          - electronics
          - book
          type: string
          minLength: 1
        description: |-
          * `standard` - Standard
          * `apparel` - Apparel
          * `grocery` - Grocery
          * `electronics` - Electronics
          * `book` - Book
      - in: query
        name: q
        schema:
          type: string
          maxLength: 100
      tags:
      - catalog
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProductSummaryPage'
          description: ''
  /api/catalog/products/{slug}/:
    get:
      operationId: catalog_product
      description: Base for every cookie-authenticated or sign-in endpoint.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - catalog
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProductDetail'
          description: ''
  /api/checkout/:
    post:
      operationId: checkout_create
      description: Base for every cookie-authenticated or sign-in endpoint.
      tags:
      - checkout
      security:
      - customerSession: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checkout'
          description: ''
  /api/checkout/{session_id}/:
    get:
      operationId: checkout_get
      description: Base for every cookie-authenticated or sign-in endpoint.
      parameters:
      - in: path
        name: session_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - checkout
      security:
      - customerSession: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checkout'
          description: ''
    patch:
      operationId: checkout_update
      description: Base for every cookie-authenticated or sign-in endpoint.
      parameters:
      - in: path
        name: session_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - checkout
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCheckoutUpdateRequest'
      security:
      - customerSession: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checkout'
          description: ''
  /api/checkout/{session_id}/order/:
    post:
      operationId: checkout_place_order
      description: Base for every cookie-authenticated or sign-in endpoint.
      parameters:
      - in: path
        name: session_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceOrderRequest'
        required: true
      security:
      - customerSession: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
  /api/checkout/{session_id}/release/:
    post:
