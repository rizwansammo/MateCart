openapi: 3.0.3
info:
  title: MateCart Commerce API
  version: 0.1.0
  description: Storefront, checkout and merchant API for a single MateCart store deployment.
paths:
  /api/account/addresses/:
    get:
      operationId: address_list
      description: Base for every cookie-authenticated or sign-in endpoint.
      tags:
      - checkout
      security:
      - customerSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Address'
          description: ''
    post:
      operationId: address_create
      description: Base for every cookie-authenticated or sign-in endpoint.
      tags:
      - checkout
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressInputRequest'
      security:
      - customerSession: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
          description: ''
  /api/account/addresses/{address_id}/:
    patch:
      operationId: address_update
      description: Base for every cookie-authenticated or sign-in endpoint.
      parameters:
      - in: path
        name: address_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - checkout
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAddressInputRequest'
      security:
      - customerSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
          description: ''
    delete:
      operationId: address_delete
      description: Base for every cookie-authenticated or sign-in endpoint.
      parameters:
      - in: path
        name: address_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - checkout
      security:
      - customerSession: []
      responses:
        '204':
          description: No response body
  /api/account/code/resend/:
    post:
      operationId: account_code_resend
      description: Resend a code for a registration, phone sign-in, or (signed in)
        a linking or step-up code.
      tags:
      - account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeRefRequest'
        required: true
      security:
      - customerSession: []
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challenge'
          description: ''
  /api/account/google/callback/:
    get:
      operationId: account_google_callback
      description: Google redirects the browser here. Always answers with a redirect
        to a storefront page.
      parameters:
      - in: query
        name: code
        schema:
          type: string
      - in: query
        name: error
        schema:
          type: string
      - in: query
        name: state
        schema:
          type: string
      tags:
      - account
      security:
      - {}
      responses:
        '302':
          description: Redirect to the storefront
  /api/account/google/start/:
    get:
      operationId: account_google_start
      description: 'Browser navigation (not XHR): redirects to Google''s consent screen.'
      parameters:
      - in: query
        name: next
        schema:
          type: string
      tags:
      - account
      security:
      - {}
      responses:
        '302':
          description: Redirect to Google
  /api/account/library/:
    get:
      operationId: buyer_digital_library
      description: Base for every cookie-authenticated or sign-in endpoint.
      tags:
      - digital-library
      security:
      - customerSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LibraryItem'
          description: ''
  /api/account/library/{entitlement_id}/download/:
    get:
      operationId: buyer_digital_download
      description: Base for every cookie-authenticated or sign-in endpoint.
      parameters:
      - in: path
        name: entitlement_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - digital-library
      security:
      - customerSession: []
      responses:
        '200':
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          description: ''
  /api/account/link/email/start/:
    post:
      operationId: account_link_email_start
      description: Base for every cookie-authenticated or sign-in endpoint.
      tags:
      - account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
        required: true
      security:
      - customerSession: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challenge'
          description: ''
  /api/account/link/email/verify/:
    post:
      operationId: account_link_email_verify
      description: Base for every cookie-authenticated or sign-in endpoint.
      tags:
      - account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeCodeRequest'
        required: true
      security:
      - customerSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerAccount'
          description: ''
  /api/account/link/google/remove/:
    post:
      operationId: account_unlink_google
      description: Base for every cookie-authenticated or sign-in endpoint.
      tags:
      - account
      security:
      - customerSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerAccount'
          description: ''
  /api/account/link/google/start/:
    post:
      operationId: account_link_google_start
      description: Base for every cookie-authenticated or sign-in endpoint.
      tags:
      - account
      security:
      - customerSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleStart'
          description: ''
  /api/account/link/phone/start/:
    post:
      operationId: account_link_phone_start
      description: Base for every cookie-authenticated or sign-in endpoint.
      tags:
      - account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneRequest'
        required: true
      security:
      - customerSession: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challenge'
          description: ''
  /api/account/link/phone/verify/:
    post:
      operationId: account_link_phone_verify
      description: Base for every cookie-authenticated or sign-in endpoint.
      tags:
      - account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeCodeRequest'
        required: true
      security:
      - customerSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerAccount'
          description: ''
  /api/account/login/:
    post:
      operationId: account_login
      description: Sign-in and registration steps. The customer cookie is read only
        to sign out or link.
      tags:
      - account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerAccount'
          description: ''
  /api/account/logout/:
    post:
      operationId: account_logout
      description: Sign-in and registration steps. The customer cookie is read only
        to sign out or link.
      tags:
      - account
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/account/loyalty/:
    get:
      operationId: account_loyalty
      description: Base for every cookie-authenticated or sign-in endpoint.
      tags:
      - storefront-marketing
      security:
      - customerSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerLoyalty'
          description: ''
  /api/account/me/:
    get:
      operationId: account_me
      description: Base for every cookie-authenticated or sign-in endpoint.
      tags:
      - account
      security:
      - customerSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerAccount'
          description: ''
    patch:
      operationId: account_me_update
      description: Base for every cookie-authenticated or sign-in endpoint.
      tags:
      - account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
      security:
      - customerSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerAccount'
          description: ''
  /api/account/methods/:
    get:
      operationId: account_methods
      description: Sign-in and registration steps. The customer cookie is read only
        to sign out or link.
      tags:
      - account
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInMethods'
          description: ''
  /api/account/notifications/:
    get:
      operationId: account_notifications
      description: Base for every cookie-authenticated or sign-in endpoint.
      parameters:
      - in: query
        name: category
        schema:
          enum:
          - transactional
          - security
          - operational
          - marketing
          type: string
          minLength: 1
        description: |-
          * `transactional` - Order and account updates
          * `security` - Security
          * `operational` - Store operations
          * `marketing` - Marketing
      - in: query
        name: page
        schema:
          type: integer
          maximum: 100000
          minimum: 1
          default: 1
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 25
      - in: query
        name: unread
        schema:
          type: boolean
          nullable: true
      tags:
      - account-notifications
      security:
      - customerSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxItemPage'
          description: ''
  /api/account/notifications/preferences/:
    get:
      operationId: account_notification_preferences
      description: Base for every cookie-authenticated or sign-in endpoint.
      tags:
      - account-notifications
      security:
      - customerSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Preference'
          description: ''
    put:
      operationId: account_notification_preferences_update
      description: Base for every cookie-authenticated or sign-in endpoint.
      tags:
      - account-notifications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreferenceInputRequest'
        required: true
      security:
      - customerSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Preference'
          description: ''
  /api/account/notifications/read/:
    post:
      operationId: account_notifications_read
      description: Base for every cookie-authenticated or sign-in endpoint.
      tags:
      - account-notifications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReadRequest'
      security:
      - customerSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unread'
          description: ''
  /api/account/password/change/:
    post:
      operationId: account_password_change
      description: Change the password, or set one for accounts created by phone or
        Google.
      tags:
      - account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      security:
      - customerSession: []
      responses:
        '204':
          description: No response body
  /api/account/password/forgot/:
    post:
      operationId: account_password_forgot
      description: 'Always 202: the response never reveals whether the email has an
        account.'
      tags:
      - account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
        required: true
      security:
      - {}
      responses:
        '202':
          description: No response body
  /api/account/password/reset/:
    post:
      operationId: account_password_reset
      description: Sign-in and registration steps. The customer cookie is read only
        to sign out or link.
      tags:
      - account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/account/phone/complete/:
    post:
      operationId: account_phone_complete
      description: Sign-in and registration steps. The customer cookie is read only
        to sign out or link.
      tags:
      - account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneCompleteRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerAccount'
          description: ''
  /api/account/phone/start/:
    post:
      operationId: account_phone_start
      description: Sign-in and registration steps. The customer cookie is read only
        to sign out or link.
      tags:
      - account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneRequest'
        required: true
      security:
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challenge'
          description: ''
  /api/account/phone/verify/:
    post:
      operationId: account_phone_verify
      description: Sign-in and registration steps. The customer cookie is read only
        to sign out or link.
      tags:
      - account
