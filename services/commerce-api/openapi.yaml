      - customerSession: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
  /api/cases/:
    get:
      operationId: customer_cases
      description: Base for every cookie-authenticated or sign-in endpoint.
      tags:
      - aftersales
      security:
      - customerSession: []
