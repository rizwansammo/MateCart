    get:
      operationId: manage_inventory_movements
      description: |-
        Catalogue, pricing, inventory and media management: ``catalog.manage`` (Owner, Manager,
        Content editor). Cost prices additionally need ``catalog.costs``.
      parameters:
      - in: query
        name: location
        schema:
          type: string
          format: uuid
      - in: query
        name: movement_type
        schema:
          enum:
          - receipt
          - adjustment
          - damaged
          - lost
          - returned
          - transfer_out
          - transfer_in
          - reserved
          - released
          - fulfilled
          - reversal
          type: string
          minLength: 1
        description: |-
          * `receipt` - Stock received
          * `adjustment` - Stock count adjustment
          * `damaged` - Damaged
          * `lost` - Lost
          * `returned` - Returned to stock
          * `transfer_out` - Transferred out
          * `transfer_in` - Transferred in
          * `reserved` - Reserved
          * `released` - Reservation released
          * `fulfilled` - Reserved stock dispatched
          * `reversal` - Reversal
      - in: query
        name: operation
        schema:
          type: string
          format: uuid
      - in: query
        name: page
        schema:
          type: integer
          maximum: 100000
          minimum: 1
          default: 1
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 25
      - in: query
        name: variant
        schema:
          type: string
          format: uuid
