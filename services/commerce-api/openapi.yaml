        show_name_with_logo:
          type: boolean
      required:
      - accent_color
      - favicon_url
      - logo_dark_url
      - logo_url
      - primary_color
      - show_name_with_logo
    TotpConfirmRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 16
      required:
      - code
    TotpSetup:
      type: object
      properties:
        qr_svg:
          type: string
          description: 'data: URI of an SVG QR code.'
        secret:
          type: string
          description: The setup key, grouped for manual entry.
        uri:
          type: string
      required:
      - qr_svg
      - secret
      - uri
    TrackingModeEnum:
      enum:
      - none
      - batch
      - serial
      type: string
      description: |-
        * `none` - Quantity only
        * `batch` - Batches and expiry
        * `serial` - Serial numbers
    TransferRequest:
      type: object
      properties:
        variant:
          type: string
          format: uuid
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
        serials:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 100
          maxItems: 500
        reason:
          type: string
          maxLength: 500
        reference_type:
          type: string
          maxLength: 50
        reference_id:
          type: string
          maxLength: 100
        idempotency_key:
          type: string
          nullable: true
          minLength: 1
          description: Optional client-generated key; a retry with the same key is
            applied once.
          pattern: ^[A-Za-z0-9._:-]{8,100}$
        from_location:
          type: string
          format: uuid
        to_location:
          type: string
          format: uuid
        batch:
          type: string
          nullable: true
          minLength: 1
          maxLength: 64
      required:
      - from_location
      - quantity
      - to_location
      - variant
    TransitionRequest:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/MerchantOrderTargetEnum'
        reason:
          oneOf:
          - type: string
            pattern: ^[a-z_]{0,40}$
          - type: string
            maxLength: 0
      required:
      - status
    Variant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        product:
          type: string
          format: uuid
        sku:
          type: string
        title:
          type: string
        options:
          type: array
          items:
            $ref: '#/components/schemas/VariantOption'
        position:
          type: integer
        is_active:
          type: boolean
        kind:
          $ref: '#/components/schemas/VariantKindEnum'
        digital_format:
          type: string
        barcode:
          type: string
          nullable: true
        isbn:
          type: string
          nullable: true
        weight_grams:
          type: integer
          nullable: true
        inventory_unit:
          $ref: '#/components/schemas/InventoryUnitEnum'
        net_quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,3})?$
          nullable: true
        net_unit:
          type: string
        release_date:
          type: string
          format: date
          nullable: true
        prices:
          type: array
          items:
            $ref: '#/components/schemas/Price'
        stock:
          allOf:
          - $ref: '#/components/schemas/StockSummary'
          readOnly: true
      required:
      - barcode
      - digital_format
      - id
      - inventory_unit
      - is_active
      - isbn
      - kind
      - net_quantity
      - net_unit
      - options
      - position
      - prices
      - product
      - release_date
      - sku
      - stock
      - title
      - weight_grams
    VariantKindEnum:
      enum:
      - physical
      - digital
      type: string
      description: |-
        * `physical` - Physical
        * `digital` - Digital
    VariantOption:
      type: object
      properties:
        attribute:
          type: string
        name:
          type: string
        option:
          type: string
        value:
          type: string
      required:
      - attribute
      - name
      - option
      - value
    VariantPrices:
      type: object
      properties:
        variant:
          type: string
          format: uuid
        prices:
          type: array
          items:
            $ref: '#/components/schemas/Price'
      required:
      - prices
      - variant
    VariantPricesInputRequest:
      type: object
      properties:
        prices:
          type: array
          items:
            $ref: '#/components/schemas/PriceEntryRequest'
      required:
      - prices
    VariantRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
        title:
          type: string
        product:
          type: string
          format: uuid
        product_name:
          type: string
      required:
      - id
      - product
      - product_name
      - sku
      - title
    VariantWriteRequest:
      type: object
      properties:
        sku:
          type: string
          minLength: 1
          maxLength: 70
          pattern: ^\s*[A-Za-z0-9][A-Za-z0-9._-]{0,63}\s*$
        options:
          type: object
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 64
          description: 'Option value code per product option attribute code, e.g.
            {"size": "m"}.'
        kind:
          $ref: '#/components/schemas/VariantKindEnum'
        digital_format:
          oneOf:
          - $ref: '#/components/schemas/DigitalFormatEnum'
          - $ref: '#/components/schemas/BlankEnum'
        barcode:
          type: string
          nullable: true
          maxLength: 20
        isbn:
          type: string
          nullable: true
          maxLength: 20
        weight_grams:
          type: integer
          maximum: 10000000
          minimum: 0
          nullable: true
        inventory_unit:
          $ref: '#/components/schemas/InventoryUnitEnum'
        net_quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,3})?$
          nullable: true
        net_unit:
          oneOf:
          - $ref: '#/components/schemas/NetUnitEnum'
          - $ref: '#/components/schemas/BlankEnum'
        release_date:
          type: string
          format: date
          nullable: true
        is_active:
          type: boolean
        position:
          type: integer
          maximum: 100000
          minimum: 0
        price:
          $ref: '#/components/schemas/PriceInputRequest'
      required:
      - sku
    Warranty:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        duration_months:
          type: integer
          readOnly: true
        provider:
          allOf:
          - $ref: '#/components/schemas/ProviderEnum'
          readOnly: true
        terms:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
      required:
      - duration_months
      - id
      - is_active
      - name
      - provider
      - terms
    WarrantyPage:
      type: object
      properties:
        count:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/Warranty'
      required:
      - count
      - page
      - page_size
      - results
    WarrantyWriteRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        duration_months:
          type: integer
          maximum: 120
          minimum: 1
        provider:
          $ref: '#/components/schemas/ProviderEnum'
        terms:
          type: string
          maxLength: 4000
        is_active:
          type: boolean
      required:
      - duration_months
      - name
      - provider
  securitySchemes:
    customerSession:
      type: apiKey
      in: cookie
      name: mc_customer
      description: Customer session (HttpOnly). Unsafe methods need X-CSRFToken.
    staffPendingMfa:
      type: apiKey
      in: cookie
      name: mc_staff
      description: A password-verified staff session waiting for the second step.
    staffSession:
      type: apiKey
      in: cookie
      name: mc_staff
      description: Merchant staff session (HttpOnly, path /api/manage).
