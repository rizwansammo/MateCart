components:
  schemas:
    AssignableRoleEnum:
      enum:
      - manager
      - order_handler
      - content_editor
      type: string
      description: |-
        * `manager` - manager
        * `order_handler` - order_handler
        * `content_editor` - content_editor
    Challenge:
      type: object
      properties:
        challenge_id:
          type: string
          format: uuid
        channel:
          $ref: '#/components/schemas/ChannelEnum'
        destination:
