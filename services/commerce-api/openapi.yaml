      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AfterSalesCase'
          description: ''
    post:
      operationId: customer_case_reply
      description: Base for every cookie-authenticated or sign-in endpoint.
      parameters:
      - in: path
        name: case_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - aftersales
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseMessageInputRequest'
        required: true
      security:
      - customerSession: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseMessage'
          description: ''
  /api/catalog/categories/:
    get:
      operationId: catalog_categories
      description: Base for every cookie-authenticated or sign-in endpoint.
      tags:
      - catalog
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicCategoryNode'
          description: ''
  /api/catalog/collections/:
    get:
      operationId: catalog_collections
      description: Base for every cookie-authenticated or sign-in endpoint.
      parameters:
      - in: query
        name: page
        schema:
          type: integer
          maximum: 100000
          minimum: 1
          default: 1
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 25
      tags:
      - catalog
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicCollectionPage'
          description: ''
  /api/catalog/collections/{slug}/:
    get:
      operationId: catalog_collection
      description: Base for every cookie-authenticated or sign-in endpoint.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - catalog
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicCollection'
          description: ''
  /api/catalog/media/{asset_id}/:
    get:
      operationId: catalog_media
      description: An image (or PDF size guide) used by an active product, category
        or collection.
      parameters:
      - in: path
        name: asset_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - catalog
      security:
      - {}
      responses:
        '200':
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          description: ''
  /api/catalog/products/:
    get:
      operationId: catalog_products
      description: Base for every cookie-authenticated or sign-in endpoint.
      parameters:
      - in: query
        name: brand
        schema:
          type: string
          minLength: 1
          maxLength: 140
          pattern: ^[-a-zA-Z0-9_]+$
      - in: query
        name: category
        schema:
          type: string
          minLength: 1
          maxLength: 140
          pattern: ^[-a-zA-Z0-9_]+$
      - in: query
        name: collection
        schema:
          type: string
          minLength: 1
          maxLength: 140
          pattern: ^[-a-zA-Z0-9_]+$
      - in: query
        name: max_price
        schema:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,4})?$
      - in: query
        name: min_price
        schema:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,4})?$
      - in: query
        name: ordering
        schema:
          enum:
          - newest
          - name
          - price_low
          - price_high
          - featured
          type: string
          minLength: 1
        description: |-
          * `newest` - newest
          * `name` - name
          * `price_low` - price_low
          * `price_high` - price_high
          * `featured` - featured
      - in: query
        name: page
        schema:
          type: integer
          maximum: 100000
          minimum: 1
          default: 1
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 25
      - in: query
        name: product_type
        schema:
          enum:
          - standard
          - apparel
          - grocery
          - electronics
          - book
          type: string
          minLength: 1
        description: |-
