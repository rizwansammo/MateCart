        name: source
        schema:
          enum:
          - storefront
          - facebook
          - whatsapp
          - phone
          - in_store
          - other
          type: string
          minLength: 1
        description: |-
          * `storefront` - Online store
          * `facebook` - Facebook
          * `whatsapp` - WhatsApp
          * `phone` - Phone call
          * `in_store` - In store
          * `other` - Other
