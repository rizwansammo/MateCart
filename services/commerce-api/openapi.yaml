          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneVerifyResult'
          description: ''
  /api/account/reauthenticate/:
    post:
      operationId: account_reauthenticate
      description: Base for every cookie-authenticated or sign-in endpoint.
      tags:
      - account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthenticateRequest'
      security:
      - customerSession: []
      responses:
        '204':
          description: No response body
  /api/account/reauthenticate/code/:
    post:
      operationId: account_reauthenticate_code
      description: Base for every cookie-authenticated or sign-in endpoint.
      tags:
      - account
      security:
      - customerSession: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challenge'
          description: ''
  /api/account/register/:
    post:
      operationId: account_register
      description: Sends a 6-digit code to the email; the account is created once
        confirmed.
      tags:
      - account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challenge'
          description: ''
  /api/account/register/verify/:
    post:
      operationId: account_register_verify
      description: Sign-in and registration steps. The customer cookie is read only
        to sign out or link.
      tags:
      - account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeCodeRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerAccount'
          description: ''
  /api/analytics/events/:
    post:
      operationId: storefront_event
      description: Base for every cookie-authenticated or sign-in endpoint.
      tags:
      - storefront-marketing
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventInputRequest'
        required: true
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/cart/:
    get:
      operationId: cart_get
      description: Base for every cookie-authenticated or sign-in endpoint.
      tags:
      - cart
      security:
      - customerSession: []
