components:
  schemas:
    ActiveThemeEnum:
      enum:
      - fashion-editorial
      - grocery-quickshop
      - electronics-spec-first
      - general-marketplace
      - books-literary
      type: string
      description: |-
        * `fashion-editorial` - fashion-editorial
        * `grocery-quickshop` - grocery-quickshop
        * `electronics-spec-first` - electronics-spec-first
        * `general-marketplace` - general-marketplace
        * `books-literary` - books-literary
    AddCartItemRequest:
      type: object
      properties:
        variant:
          type: string
          format: uuid
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
      required:
      - quantity
      - variant
    Address:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        label:
          type: string
          maxLength: 50
        recipient_name:
          type: string
          maxLength: 150
        phone:
          type: string
          pattern: ^\+[1-9][0-9]{6,14}$
          maxLength: 16
        address_line_1:
          type: string
          maxLength: 200
        address_line_2:
          type: string
          maxLength: 200
        city:
          type: string
          maxLength: 100
        region:
          type: string
          maxLength: 100
        postal_code:
          type: string
          maxLength: 32
        country:
          type: string
          maxLength: 2
        is_default:
          type: boolean
      required:
      - address_line_1
      - city
      - country
      - id
      - phone
      - recipient_name
    AddressInputRequest:
      type: object
      properties:
        address_name:
          type: string
          maxLength: 50
        recipient_name:
          type: string
          minLength: 1
          maxLength: 150
        phone:
          type: string
          minLength: 1
          maxLength: 40
        address_line_1:
          type: string
          minLength: 1
          maxLength: 200
        address_line_2:
          type: string
          maxLength: 200
        city:
          type: string
          minLength: 1
          maxLength: 100
        region:
          type: string
          maxLength: 100
        postal_code:
          type: string
          maxLength: 32
        country:
          type: string
          minLength: 1
          maxLength: 2
        is_default:
          type: boolean
    AdjustmentMovementTypeEnum:
      enum:
      - adjustment
      - damaged
      - lost
      - returned
      type: string
      description: |-
        * `adjustment` - adjustment
        * `damaged` - damaged
        * `lost` - lost
        * `returned` - returned
    AdjustmentRequest:
      type: object
      properties:
        variant:
          type: string
          format: uuid
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
        serials:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 100
          maxItems: 500
        reason:
          type: string
          minLength: 1
          maxLength: 500
        reference_type:
          type: string
          maxLength: 50
        reference_id:
          type: string
          maxLength: 100
        idempotency_key:
          type: string
          nullable: true
          minLength: 1
          description: Optional client-generated key; a retry with the same key is
            applied once.
          pattern: ^[A-Za-z0-9._:-]{8,100}$
        location:
          type: string
          format: uuid
          nullable: true
        movement_type:
          $ref: '#/components/schemas/AdjustmentMovementTypeEnum'
        batch:
          allOf:
          - $ref: '#/components/schemas/BatchInputRequest'
          nullable: true
      required:
      - movement_type
      - quantity
      - reason
      - variant
    AfterSalesCase:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/AfterSalesCaseKindEnum'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/AfterSalesCaseStatusEnum'
          readOnly: true
        order_item:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,3})?$
          readOnly: true
        subject:
          type: string
          readOnly: true
        reason:
          type: string
          readOnly: true
        decision_reason:
          type: string
          readOnly: true
        refund:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        replacement_order:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        messages:
          type: array
          items:
            $ref: '#/components/schemas/CaseMessage'
          readOnly: true
      required:
      - created_at
      - decision_reason
      - id
      - kind
      - messages
      - order_item
      - quantity
      - reason
      - refund
      - replacement_order
      - status
      - subject
      - updated_at
    AfterSalesCaseKindEnum:
      enum:
      - return
      - exchange
      - warranty
      - support
      type: string
      description: |-
        * `return` - Return
        * `exchange` - Exchange
        * `warranty` - Warranty
        * `support` - Support
    AfterSalesCasePage:
      type: object
      properties:
        count:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/AfterSalesCase'
      required:
      - count
      - page
      - page_size
      - results
    AfterSalesCaseStatusEnum:
      enum:
      - requested
      - approved
      - rejected
      - received
      - inspected
      - awaiting_refund
      - replacement_pending
      - resolved
      - closed
      type: string
      description: |-
        * `requested` - Requested
        * `approved` - Approved
        * `rejected` - Rejected
        * `received` - Goods received
        * `inspected` - Inspected
        * `awaiting_refund` - Awaiting verified refund
        * `replacement_pending` - Replacement pending
        * `resolved` - Resolved
        * `closed` - Closed
    AftersalesCounts:
      type: object
      properties:
        open_returns:
          type: integer
        open_exchanges:
          type: integer
        open_warranty:
          type: integer
        open_support:
          type: integer
        pending_reviews:
          type: integer
      required:
      - open_exchanges
      - open_returns
      - open_support
      - open_warranty
      - pending_reviews
    Amount:
      type: object
      properties:
        currency:
          type: string
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,4})?$
      required:
      - amount
      - currency
    AnalyticsReport:
      type: object
      properties:
        range:
          type: string
        rolling:
          type: boolean
        start:
          type: string
          format: date-time
        counter_start:
          type: string
          format: date-time
          description: Traffic and funnel totals start here (per-minute counters for
            24 h).
        breakdown_start:
          type: string
          format: date-time
          description: Series, top products and sources start here (hourly buckets
            for 24 h).
        end:
          type: string
          format: date-time
        first_day:
          type: string
          format: date
          nullable: true
        last_day:
          type: string
          format: date
          nullable: true
        traffic:
          $ref: '#/components/schemas/Traffic'
        funnel:
          $ref: '#/components/schemas/Funnel'
        orders:
          $ref: '#/components/schemas/OrdersSummary'
        series:
          type: array
          items:
            $ref: '#/components/schemas/SeriesPoint'
        top_products:
          type: array
          items:
            $ref: '#/components/schemas/EngagedProduct'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/SourceRow'
        campaigns:
          type: array
          items:
            $ref: '#/components/schemas/PromotionResult'
        flash_sales:
          type: array
          items:
            $ref: '#/components/schemas/PromotionResult'
        coupons:
          type: array
          items:
            $ref: '#/components/schemas/CouponUsage'
        loyalty:
          $ref: '#/components/schemas/LoyaltyActivity'
        active_coupons:
          type: integer
      required:
      - active_coupons
      - breakdown_start
      - campaigns
      - counter_start
      - coupons
      - end
      - first_day
      - flash_sales
      - funnel
      - last_day
      - loyalty
      - orders
      - range
      - rolling
      - series
      - sources
      - start
      - top_products
      - traffic
    ApparelDetails:
      type: object
      properties:
        audience:
          allOf:
          - $ref: '#/components/schemas/AudienceEnum'
          readOnly: true
        material:
          type: string
          readOnly: true
        fit:
          type: string
          readOnly: true
        care_instructions:
          type: string
          readOnly: true
        size_guide:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        size_guide_notes:
          type: string
          readOnly: true
      required:
      - audience
      - care_instructions
      - fit
      - material
      - size_guide
      - size_guide_notes
    ApparelDetailsInputRequest:
      type: object
      properties:
        audience:
          oneOf:
          - $ref: '#/components/schemas/AudienceEnum'
          - $ref: '#/components/schemas/BlankEnum'
        material:
          type: string
          maxLength: 200
        fit:
          type: string
          maxLength: 50
        care_instructions:
          type: string
          maxLength: 1000
        size_guide:
          type: string
          format: uuid
          nullable: true
        size_guide_notes:
          type: string
          maxLength: 2000
    Appearance:
      type: object
      properties:
        preset:
          type: string
        preset_label:
          type: string
        active_theme:
          $ref: '#/components/schemas/ActiveThemeEnum'
        store_name:
          type: string
        can_rename:
          type: boolean
        default_language:
          type: string
        languages:
          type: array
          items:
            type: string
        primary_color:
          type: string
        accent_color:
          type: string
        logo:
          allOf:
          - $ref: '#/components/schemas/AssetRef'
          nullable: true
        logo_dark:
          allOf:
          - $ref: '#/components/schemas/AssetRef'
          nullable: true
        favicon:
          allOf:
          - $ref: '#/components/schemas/AssetRef'
          nullable: true
        tagline:
          type: string
        description:
          type: string
        announcement:
          type: string
        footer_text:
          type: string
        show_name_with_logo:
          type: boolean
        translations: {}
        updated_at:
          type: string
          format: date-time
          nullable: true
      required:
      - accent_color
      - active_theme
      - announcement
      - can_rename
      - default_language
      - description
      - favicon
      - footer_text
      - languages
      - logo
      - logo_dark
      - preset
      - preset_label
      - primary_color
      - show_name_with_logo
      - store_name
      - tagline
      - translations
      - updated_at
    AssetRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          readOnly: true
        width:
          type: integer
          nullable: true
        height:
          type: integer
          nullable: true
      required:
      - height
      - id
      - url
      - width
    AssignableRoleEnum:
      enum:
      - manager
      - order_handler
      - content_editor
      type: string
      description: |-
        * `manager` - manager
        * `order_handler` - order_handler
        * `content_editor` - content_editor
    AssistedExpectedTotalsRequest:
      type: object
      description: |-
        The totals from the quote the merchant reviewed. Placement is refused with
        ``quote_changed`` when the server's totals differ, so a changed price is never accepted
        silently.
      properties:
        currency:
          type: string
          minLength: 3
          maxLength: 3
        item_subtotal:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,4})?$
        discount_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,4})?$
        shipping_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,4})?$
        tax_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,4})?$
        grand_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,4})?$
      required:
      - currency
      - discount_total
      - grand_total
      - item_subtotal
      - shipping_total
      - tax_total
    AssistedItemRequest:
      type: object
      properties:
        variant:
          type: string
          format: uuid
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
      required:
      - quantity
      - variant
    AssistedOrderInputRequest:
      type: object
      description: A draft assisted order. Every detail is optional so staff can price
        it while typing.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AssistedItemRequest'
        recipient_name:
          type: string
          minLength: 1
          maxLength: 150
        contact_phone:
          type: string
          minLength: 1
          maxLength: 40
        contact_email:
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
        address_line_1:
          type: string
          minLength: 1
          maxLength: 200
        address_line_2:
          type: string
          maxLength: 200
        city:
          type: string
          minLength: 1
          maxLength: 100
        region:
          type: string
          maxLength: 100
        postal_code:
          type: string
          maxLength: 32
        country:
          type: string
          minLength: 1
          maxLength: 2
        delivery_notes:
          type: string
          maxLength: 500
        shipping_method:
          type: string
          format: uuid
          nullable: true
        delivery_slot:
          type: string
          format: uuid
          nullable: true
        coupon_code:
          type: string
          maxLength: 32
        payment_method:
          $ref: '#/components/schemas/PaymentMethodEnum'
        source:
          $ref: '#/components/schemas/AssistedOrderSourceEnum'
        source_reference:
          type: string
          maxLength: 120
        customer_request_attested:
          type: boolean
          description: Staff confirm the customer asked for this order. Not a customer
            signature.
        idempotency_key:
          type: string
          minLength: 8
          maxLength: 100
        expected_totals:
          $ref: '#/components/schemas/AssistedExpectedTotalsRequest'
      required:
      - address_line_1
      - city
      - contact_phone
      - country
