openapi: 3.0.3
info:
  title: MateCart Commerce API
  version: 0.1.0
  description: Storefront, checkout and merchant API for a single MateCart store deployment.
paths:
  /api/account/code/resend/:
    post:
      operationId: account_code_resend
      description: Resend a code for a registration, phone sign-in, or (signed in)
        a linking or step-up code.
      tags:
      - account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeRefRequest'
        required: true
      security:
      - customerSession: []
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challenge'
          description: ''
  /api/account/google/callback/:
    get:
      operationId: account_google_callback
      description: Google redirects the browser here. Always answers with a redirect
        to a storefront page.
      parameters:
      - in: query
        name: code
        schema:
          type: string
      - in: query
        name: error
        schema:
          type: string
      - in: query
        name: state
        schema:
          type: string
      tags:
      - account
      security:
      - {}
      responses:
        '302':
          description: Redirect to the storefront
  /api/account/google/start/:
    get:
      operationId: account_google_start
      description: 'Browser navigation (not XHR): redirects to Google''s consent screen.'
      parameters:
      - in: query
        name: next
        schema:
          type: string
      tags:
      - account
      security:
      - {}
      responses:
        '302':
          description: Redirect to Google
  /api/account/link/email/start/:
    post:
      operationId: account_link_email_start
