components:
  schemas:
    ActivationPreview:
      type: object
      properties:
        email:
          type: string
          format: email
        full_name:
          type: string
      required:
      - email
      - full_name
    Admin:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        full_name:
          type: string
        role:
          type: string
        permissions:
          type: array
          items:
            type: string
          readOnly: true
      required:
      - email
      - full_name
      - id
      - permissions
      - role
    BackupStatusEnum:
      enum:
      - successful
      - failed
      type: string
      description: |-
        * `successful` - successful
        * `failed` - failed
    Challenge:
      type: object
      properties:
        challenge_id:
          type: string
          format: uuid
        channel:
          type: string
          readOnly: true
        destination:
          type: string
          readOnly: true
        resend_in:
          type: integer
          readOnly: true
        expires_in:
          type: integer
          readOnly: true
      required:
      - challenge_id
      - channel
      - destination
      - expires_in
      - resend_in
    ChallengeCodeRequest:
      type: object
      properties:
        challenge_id:
          type: string
          format: uuid
        code:
          type: string
          minLength: 1
          maxLength: 16
      required:
      - challenge_id
      - code
    CheckStateEnum:
      enum:
      - ok
      - error
      type: string
      description: |-
        * `ok` - ok
        * `error` - error
    Client:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        stores_count:
          type: integer
          readOnly: true
        servers_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        display_name:
          type: string
          maxLength: 160
        legal_name:
          type: string
          maxLength: 200
        client_type:
          type: string
          maxLength: 32
        primary_contact_name:
          type: string
          maxLength: 160
        contact_email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        contact_phone:
          type: string
          maxLength: 32
        country:
          type: string
          maxLength: 2
        time_zone:
          type: string
          maxLength: 64
        address:
          type: string
          maxLength: 1000
        internal_reference:
          type: string
          nullable: true
          maxLength: 80
        status:
          $ref: '#/components/schemas/ClientStatusEnum'
        onboarding_date:
          type: string
          format: date
          nullable: true
        notes:
          type: string
          maxLength: 4000
        account_manager:
          type: string
          format: uuid
          nullable: true
      required:
      - country
      - created_at
      - display_name
      - id
      - servers_count
      - stores_count
      - updated_at
    ClientRequest:
      type: object
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 160
        legal_name:
          type: string
          maxLength: 200
        client_type:
          type: string
          minLength: 1
          maxLength: 32
        primary_contact_name:
          type: string
          maxLength: 160
        contact_email:
