[project]
name = "matecart-control-api"
version = "0.1.0"
description = "NetaMate Central Platform Console API: client registry, deployments and fleet operations."
requires-python = ">=3.13,<3.14"
dependencies = [
    "django>=5.2.18,<5.3",  # LTS line; move to the 6.2 LTS once the ecosystem declares support
    "djangorestframework>=3.18.3",
    "drf-spectacular>=0.30.0",
    "django-environ>=0.14.0",
    "django-stubs-ext>=5.2.9,<5.3",  # runtime half of django-stubs: makes generic classes subscriptable
    "psycopg[binary]>=3.3.6",
    "argon2-cffi>=25.1.0",  # Argon2id password hashing (Django's recommended hasher)
    "pyotp>=2.10.0",  # RFC 6238 TOTP for authenticator apps
    "segno>=1.6.6",  # QR codes for authenticator setup (BSD-3-Clause, no dependencies)
    "cryptography>=50.0.2",  # Fernet encryption of TOTP secrets at rest
    "redis>=6.4",  # rate limiting store
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.17.2",
    "mypy",
    "django-stubs[compatible-mypy]>=5.2.9,<5.3",
    "djangorestframework-stubs[compatible-mypy]",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
# --ds wins over DJANGO_SETTINGS_MODULE, which compose sets to development settings.
addopts = "--ds=config.settings.test --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
# Generated by makemigrations; reviewed as SQL (sqlmigrate) rather than linted.
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "DJ", "S", "SIM", "RUF", "PT", "C4", "DTZ", "T20"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603", "RUF012"]
# Django model Meta options (constraints, indexes) are class-level lists by design.
"**/models.py" = ["RUF012"]
"config/settings/*.py" = ["F403", "F405"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["/migrations/"]

[[tool.mypy.overrides]]
module = ["environ"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["config.settings.*"]
# Settings modules use star imports from base by Django convention.
disable_error_code = ["attr-defined"]

[tool.django-stubs]
django_settings_module = "config.settings.test"
