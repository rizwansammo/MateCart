{% extends "email/_layout.html" %}
{% block content %}
<h1 style="margin:0 0 12px;font-size:22px;line-height:28px">Reset your console password</h1>
<p style="margin:0 0 20px;font-size:15px;line-height:22px">Choose a new password with the button below. The link works once and expires in 1 hour. Two-step verification stays on.</p>
<p style="margin:0 0 20px"><a href="{{ link }}" style="display:inline-block;padding:12px 20px;background:#00843c;color:#ffffff;text-decoration:none;font-weight:700;border-radius:4px">Choose a new password</a></p>
{% endblock %}
